<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font: bold 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #e0e0e8;
    }
    .subtitle {
      font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #a0a0b0;
    }
  </style>

  <rect width="100%" height="100%" fill="#1e1e2e"/>

  <!-- Centered Logo Group -->
  <g transform="translate(400,90)">

    <!-- Document icon (matches popup/options inline logo and toolbar PNGs) -->
    <svg x="-150" y="-20" width="36" height="36" viewBox="0 0 24 24"
         fill="none" stroke="#7f6df2" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>

    <!-- Title -->
    <text x="-100" y="8" class="title">
      vault-clipper
    </text>

  </g>

  <!-- Subtitle aligned to same center -->
  <text x="386" y="140" text-anchor="middle" class="subtitle">
    Clip anything into your vault
  </text>

</svg>
